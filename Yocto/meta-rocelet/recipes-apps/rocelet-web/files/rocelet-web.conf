# qsfp28-fmc-rocelet web UI settings (key = value). A copy named rocelet-web.conf on the SD card's
# FAT boot partition (next to BOOT.BIN) overrides these values.
#
# listen = 0.0.0.0     address to listen on
# port = 80            HTTP port
# token =              access token; empty = no token (anybody on the network can control the
#                      design; the page shows a warning). Set one for any shared network.
# title =             name shown on the page (default: the hostname, rocelet-z106 / rocelet-v190)
# socket = /run/rocelet/roceletd.sock
port = 80
token =
