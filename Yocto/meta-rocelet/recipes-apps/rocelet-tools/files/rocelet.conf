# qsfp28-fmc-rocelet daemon settings (key = value). A copy named rocelet.conf on the SD card's FAT
# boot partition (next to BOOT.BIN) overrides these values.
#
# iface = rl0          the port's Linux interface (rl_net.ko); its MAC and IPv4 address are the
#                      engine's (RoCE answers for that address). The address itself is set by
#                      systemd-networkd: /etc/systemd/network/10-rl0.network
# hsb = off            on: start the Holoscan Sensor Bridge device mode at boot ('rl hsb on')
# socket = /run/rocelet/roceletd.sock   the console socket (rl, the web UI); group below
# group = rocelet
iface = rl0
hsb = off
