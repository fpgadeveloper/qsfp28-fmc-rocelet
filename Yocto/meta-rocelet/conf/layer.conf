# meta-rocelet: the qsfp28-fmc-rocelet Linux stack on the PS (board independent): the rl_net kernel
# module (rl0), the daemon roceletd + the CLI rl, the web UI, the rl0 network configuration and the
# image additions (bench set). Enabled per target by listing Yocto/meta-rocelet in
# Yocto/bsp/<target>/bblayers-extra.txt.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-rocelet"
BBFILE_PATTERN_meta-rocelet = "^${LAYERDIR}/"
# Below meta-user (7) so a board's meta-user can override anything here.
BBFILE_PRIORITY_meta-rocelet = "6"
LAYERSERIES_COMPAT_meta-rocelet = "scarthgap"
LAYERDEPENDS_meta-rocelet = "core openembedded-layer"

# Repo root (Yocto/meta-rocelet/../..): the recipes take their sources from sw/linux/, the console
# sources Vitis/common/src/ and the engine's register header submodules/rocelet/sw/ in this
# repository rather than from a fetched tarball (one source tree for bare metal and Linux).
ROCELET_REPO_ROOT := "${@os.path.normpath(os.path.join('${LAYERDIR}', '..', '..'))}"
