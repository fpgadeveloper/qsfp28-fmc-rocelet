# qsfp28-fmc-rocelet (ZCU106):
#  - generic UIO for the rocelet register window (/dev/rocelet-regs) and the PS DDR window
#    carve-out (/dev/rocelet-ddr), both owned by roceletd;
#  - the AXI DMA of the netdev channel (xilinx_dma, used through dmaengine by rl_net.ko: rl0);
#  - the PL AXI IIC buses (i2c-xiic) and i2c-dev: roceletd programs the FMC's Si5328 and reads
#    the QSFP28 module from user space;
#  - the board RJ45 (PS GEM3, TI DP83867).
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y
CONFIG_DMADEVICES=y
CONFIG_DMA_ENGINE=y
CONFIG_XILINX_DMA=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_XILINX=y
CONFIG_DP83867_PHY=y
CONFIG_NET_PKTGEN=m
