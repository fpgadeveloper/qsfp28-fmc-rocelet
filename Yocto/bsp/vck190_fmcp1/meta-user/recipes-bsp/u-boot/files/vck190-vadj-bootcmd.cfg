#
# Same write sequence as 2x-qsfp28-fmc's VCK190 BSP (hardware-proven with the OP120 on FMCP1), but
# NOT the same bus number: u-boot numbers its I2C buses by the device-tree aliases, and the PL
# AXI IIC controllers come first (i2c0 = Si5328 0x8010_0000, i2c1 = QSFP0 0x8011_0000 in this
# design; 2x-qsfp28-fmc has three), so LPD I2C0 (ff020000) is i2c2 here. With "i2c dev 3"
# (= ff030000) every write timed out (-110) and VADJ stayed off until roceletd enabled it.
# roceletd repeats the enable at start-up (vadj.c, idempotent) for boots that bypass this bootcmd.
#
# Enable VADJ before every boot (ported from the PetaLinux BSP's
# platform-top.h).
#
# On VCK190/VMK180 the FMC VADJ rail comes from the IR38164 buck regulator
# (U185, I2C addr 0x1E behind mux 0x74 channel 0 on LPD I2C0). Normally the
# system controller enables it, but doing it in u-boot (1) guarantees VADJ is
# up before Linux probes the FMC's Si5328/QSFPs (otherwise the clk driver
# probes a dead chip and the MRMAC GT never gets its refclk), and (2) works
# when the SC is absent or unconfigured.
#
# "i2c dev 2": LPD I2C0 (ff020000) = alias i2c2 of this design ("i2c bus" at the u-boot prompt
# lists it). Re-check the aliases of system.dtb if PL I2C controllers are added or removed. The write sequence programs the
# 1.5V VADJ profile and sets the enable bit (0x22=0x80) last.
CONFIG_CMD_I2C=y
CONFIG_BOOTCOMMAND="i2c dev 2; i2c mw 0x74 0x00.0 0x01 0x1; i2c mw 0x1E 0x24.1 0x01 0x1; i2c mw 0x1E 0x25.1 0x80 0x1; i2c mw 0x1E 0x3A.1 0x01 0x1; i2c mw 0x1E 0x3B.1 0xF3 0x1; i2c mw 0x1E 0x3D.1 0x01 0x1; i2c mw 0x1E 0x3E.1 0xF3 0x1; i2c mw 0x1E 0x3F.1 0x00 0x1; i2c mw 0x1E 0x40.1 0x00 0x1; i2c mw 0x1E 0x41.1 0x00 0x1; i2c mw 0x1E 0x42.1 0x00 0x1; i2c mw 0x1E 0x22.1 0x80 0x1; run distro_bootcmd"
