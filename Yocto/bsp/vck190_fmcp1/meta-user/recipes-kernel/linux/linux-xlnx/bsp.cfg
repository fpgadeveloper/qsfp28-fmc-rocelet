# qsfp28-fmc-rocelet (VCK190):
#  - generic UIO for the rocelet register window (/dev/rocelet-regs), the PS DDR window carve-out
#    (/dev/rocelet-ddr) and the MRMAC's registers (/dev/rocelet-mrmac), all owned by roceletd;
#  - the AXI DMA of the netdev channel (xilinx_dma, used through dmaengine by rl_net.ko: rl0);
#  - the PL AXI IIC buses (i2c-xiic), the PS LPD I2C0 (i2c-cadence: VADJ regulator behind the
#    TCA9548) and i2c-dev: roceletd programs the FMC's Si5328, reads the QSFP28 module and checks
#    VADJ from user space;
#  - the PMC eFUSE cache through the xilinx-secure-config nvmem device (device serial / DNA);
#  - the board RJ45s (PS GEM0 / GEM1, TI DP83867).
CONFIG_UIO=y
CONFIG_UIO_PDRV_GENIRQ=y
CONFIG_DMADEVICES=y
CONFIG_DMA_ENGINE=y
CONFIG_XILINX_DMA=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_XILINX=y
CONFIG_I2C_CADENCE=y
CONFIG_NVMEM_ZYNQMP=y
CONFIG_XLNX_SEC_CFG=y
CONFIG_DP83867_PHY=y
